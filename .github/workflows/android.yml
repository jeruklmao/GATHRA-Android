name: Android quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36.1"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android quality gates
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew lintDebug
          ./gradlew assembleDebug
          ./gradlew assembleDemo
